version: "3.9"

services:
  client_app:
    build:
      context: ./front
      dockerfile: dockerfile.prod
      args:
       - VITE_API_END_POINT=http://localhost
    container_name: chadopt_client
    ports:
      - "5173:5173"
    restart: always
    depends_on:
      - server_app

  server_app:
    build:
      context: ./back
      dockerfile: dockerfile.prod
    container_name: chadopt_server
    ports:
      - "3001:3001"
    restart: always
    depends_on:
      - db_app
    environment:
      - NODE_ENV=dev
      #  - DATABASE_URL=postgresql://myuser:password@db_app:5432/mydb?schema=public

  db_app:
    image: postgres:16-alpine
    restart: always
    container_name: chadopt_db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data 


volumes:
  pgdata:

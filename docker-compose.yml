version: "3.9"

services:
  client_app:
    build:
      context: ./front
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - postgres
      - server_app
    environment:
      - API_END_POINT=http://server_app:3001
    networks:
      - front-net

  server_app:
    build:
      context: ./back
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    depends_on:
      - postgres
    environment:
      - NODE_ENV=dev
    networks:
      - back-net
      - front-net

  postgres:
    image: postgres:16-alpine
    restart: always
    ports:
      - "5433:5433"
    environment:
      - POSTGRES_USER=myuser
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=mydb
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - back-net

networks:
  front-net:
  back-net:

volumes:
  pgdata:
